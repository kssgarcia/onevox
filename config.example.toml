# Onevox Configuration Example
# Copy this file to the appropriate location for your platform:
# - macOS: ~/Library/Application Support/com.onevox.onevox/config.toml
# - Linux: ~/.config/onevox/config.toml
# - Windows: %APPDATA%\onevox\config.toml

[daemon]
# Start daemon automatically on system boot
auto_start = true

# Logging level: trace, debug, info, warn, error
log_level = "debug"

# Log file rotation (in days)
log_retention_days = 7

[hotkey]
# Global hotkey combination (platform-specific defaults)
# macOS: "Cmd+Shift+0"
# Linux: "Ctrl+Shift+Space"
# Windows: "Ctrl+Shift+Space"
#
# Examples:
# - macOS: "Cmd+Shift+Space", "Ctrl+Option+D"
# - Linux: "Ctrl+Shift+Space", "Alt+D", "Super+Space"
# - Windows: "Win+Shift+Space", "Ctrl+Alt+D"
trigger = "Cmd+Shift+0"

# Mode: "push-to-talk" (hold to record) or "toggle" (press once to start, again to stop)
mode = "push-to-talk"

# Minimum hold duration (ms) to prevent accidental triggers
min_hold_duration_ms = 100

[audio]
# Audio input device (use "default" or specific device name)
# Run `onevox devices list` to see available devices
device = "HD 4.40BT"

# Sample rate (Hz) - models typically expect 16000
sample_rate = 16000

# Chunk duration for processing (ms)
# Smaller = lower latency, but more overhead
# Recommended: 100-200ms
chunk_duration_ms = 200

# Audio buffer size (seconds)
# How much audio to keep in memory before dropping
buffer_duration_sec = 2

[ui]
# Show floating desktop indicator while recording/processing
recording_overlay = true

[vad]
# Voice Activity Detection - automatically detect speech and silence
#
# enabled = false: Manual control (recommended for Wayland/manual commands)
#   - Use start-dictation/stop-dictation commands to control recording
#   - Recording continues until you explicitly stop it
#
# enabled = true: Automatic speech detection (for hotkey-based workflows)
#   - Automatically stops recording after detecting silence
#   - Good for push-to-talk with hotkeys on X11/macOS
enabled = false

# VAD backend: "silero" (accurate, ONNX-based) or "webrtc" (fast, CPU-only)
backend = "energy"

# Detection threshold (0.0 - 1.0)
# Lower = more sensitive (may include noise)
# Higher = less sensitive (may cut off quiet speech)
threshold = 0.001

# Pre-roll: capture audio before VAD trigger (ms)
# Ensures you don't miss the beginning of speech
pre_roll_ms = 300

# Post-roll: continue recording after VAD silence (ms)
# Prevents cutting off the end of speech
post_roll_ms = 500

min_silence_chunks = 3
adaptive = true

[model]
# Model identifier - determines which model and backend to use
# Models are stored in platform-appropriate cache directory:
#   - macOS: ~/Library/Caches/com.onevox.onevox/models/<model_id>/
#   - Linux: ~/.cache/onevox/models/<model_id>/
#   - Windows: %LOCALAPPDATA%\onevox\onevox\cache\models\<model_id>\
#
# Download models with: onevox models download <model_id>
#
# Available Whisper GGML models (whisper.cpp backend, auto-selected):
#   English-only variants:
#     - ggml-tiny.en (fastest, ~75MB)
#     - ggml-base.en (recommended, ~142MB)
#     - ggml-small.en (~466MB)
#     - ggml-medium.en (~1.5GB)
#
#   Multilingual variants (auto-detect language):
#     - ggml-tiny (~75MB, 99+ languages)
#     - ggml-base (~142MB, 99+ languages)
#     - ggml-small (~466MB, 99+ languages)
#     - ggml-medium (~1.5GB, 99+ languages)
#     - ggml-large-v2 (~2.9GB, 99+ languages)
#     - ggml-large-v3 (~2.9GB, 99+ languages)
#     - ggml-large-v3-turbo (~1.6GB, 99+ languages, faster)
#
# Available ONNX models (included by default):
#   - parakeet-ctc-0.6b (multilingual, 100+ languages, 15-25x RT, INT8 quantized)
#
# Backend auto-detection:
#   - Models containing "parakeet" or "onnx" use ONNX Runtime backend
#   - All other models use whisper.cpp backend
#
# Language detection:
#   - English-only models (.en suffix) only transcribe English
#   - Multilingual models auto-detect language from audio
#   - All models transcribe only (no translation to English)
model_path = "ggml-base.en"

# Compute device: "auto", "cpu", "gpu"
# "auto" will select GPU if available, otherwise CPU
device = "auto"

# Load model at daemon startup (reduces first-transcription latency)
preload = true

[post_processing]
# Automatically add punctuation (experimental)
auto_punctuation = true

# Capitalize first letter of sentences
auto_capitalize = true

# Remove filler words (um, uh, like, etc.)
remove_filler_words = false

# Custom word replacements
# Format: "spoken" = "written"
[post_processing.replacements]
# "onevox" = "Onevox"
# "github" = "GitHub"
# "javascript" = "JavaScript"

[injection]
# Text injection method: "accessibility", "clipboard", "paste"
# - accessibility: Direct text injection (requires permissions)
# - clipboard: Copy to clipboard and simulate paste
# - paste: Simulate typing (slowest, but most compatible)
method = "accessibility"

# Delay before pasting (ms) - only for clipboard/paste methods
paste_delay_ms = 50

# Delay after closing overlay before injection starts (ms)
# Helps avoid focus races on some platforms/apps
focus_settle_ms = 80

# Simulate typing speed (chars/sec) - only for paste method
typing_speed = 100

[tui]
# Enable TUI (terminal user interface)
enabled = true

# Update frequency (Hz)
refresh_rate = 10

# Theme: "dark", "light"
theme = "dark"

[history]
# Enable transcription history tracking
enabled = true

# Maximum number of history entries to keep
# Oldest entries are automatically removed when limit is reached
max_entries = 1000

# Automatically save history after each transcription
# If false, history is only saved on daemon shutdown
auto_save = true

[telemetry]
# Enable performance metrics collection
enabled = true

# Metrics retention (days)
retention_days = 30

# Export format: "json", "csv", "prometheus"
export_format = "json"

[advanced]
# Maximum concurrent transcriptions
# Useful for batch processing, but increases memory usage
max_concurrent_transcriptions = 1

# Audio chunk queue size
# Larger = more buffer, but higher latency
chunk_queue_size = 10

# Model inference timeout (seconds)
inference_timeout_sec = 30

# Restart daemon on fatal errors
auto_restart = true

# ============================================================
# CHAT MODE - Conversational AI (STT→LLM→TTS Pipeline)
# ============================================================
# Chat features are now built-in by default!
# No need for --features chat when building.
# Just download the models and enable it in the config.

[chat]
# Enable conversational AI mode
# When enabled, you can have voice conversations with an AI assistant
# using a separate hotkey from regular transcription
# Default: false (enable after downloading models)
enabled = false

# Chat hotkey (separate from transcription hotkey)
# macOS: "Cmd+Shift+9"
# Linux/Windows: "Ctrl+Shift+Alt+Space"
hotkey = "Cmd+Shift+9"

# Mode: "push-to-talk" (hold to record) or "toggle" (press once to start, again to stop)
mode = "push-to-talk"

[chat.llm]
# LLM (Large Language Model) configuration

# Model identifier
# Available models:
#   - lfm2-1.2b-tool-q4 (GGUF, ~731MB, fast, recommended)
#   - lfm2-1.2b-tool-q5 (GGUF, ~843MB, balanced quality/speed)
#   - lfm2-1.2b-tool-q8 (GGUF, ~1.25GB, best quality)
model_path = "lfm2-1.2b-tool-q4"

# Compute device: "auto", "cpu", "gpu"
# "auto" will use GPU if available, otherwise CPU
device = "auto"

# Context length (max tokens in conversation history)
# Larger = more conversation memory, but slower
# Options: 512, 1024, 2048, 4096
context_length = 2048

# Temperature (0.0 - 2.0)
# Lower = more focused and deterministic
# Higher = more creative and random
# Recommended: 0.7
temperature = 0.7

# Maximum tokens to generate per response
# Lower = shorter responses (faster)
# Higher = longer responses (slower)
# Recommended: 128-256
max_tokens = 256

# System prompt (instructions for the AI)
# This defines the AI's personality and behavior
system_prompt = "You are a helpful AI assistant. Be concise and direct."

# Preload model at daemon startup
# true = faster first response, uses more memory
# false = slower first response, saves memory
preload = false

[chat.tts]
# TTS (Text-to-Speech) configuration

# Model identifier
# Available models:
#   - kokoro-tts-q8f16 (ONNX, ~86MB, recommended, best balance)
#   - kokoro-tts-fp16 (ONNX, ~163MB, highest quality)
#   - kokoro-tts-q4f16 (ONNX, ~154MB, fastest inference)
model_path = "kokoro-tts-q8f16"

# Compute device: "auto", "cpu", "gpu"
# Kokoro is CPU-friendly and doesn't benefit much from GPU
device = "auto"

# Voice selection
# Available voices:
#   - af_heart: Female, American, warm and friendly
#   - af_sky: Female, American, clear and professional
#   - am_adam: Male, American, deep and authoritative
#   - am_michael: Male, American, friendly and casual
#   - bf_emma: Female, British, elegant
#   - bm_george: Male, British, authoritative
voice_id = "af_heart"

# Speech rate (0.5 - 2.0)
# 1.0 = normal speed
# < 1.0 = slower
# > 1.0 = faster
speech_rate = 1.0

# Preload model at daemon startup
preload = false

# ============================================================
# CHAT USAGE - Quick Start
# ============================================================
#
# Chat features are built-in! Just follow these steps:
#
# 1. Enable chat mode: set `enabled = true` above
# 2. Download models (only needed once):
#    onevox models download lfm2-1.2b-tool-q4
#    onevox models download kokoro-tts-q8f16
# 3. Restart daemon:
#    onevox daemon restart
# 4. Use chat hotkey (Cmd+Shift+9) to talk with AI
# 5. Use regular hotkey (Cmd+Shift+0) for transcription
#
# Pipeline: You speak → STT → LLM generates response → TTS speaks back
#
# GPU Acceleration (optional):
# - Build with Metal: cargo build --release --features metal
# - Build with CUDA: cargo build --release --features cuda
#
# Tips:
# - Adjust temperature for different conversation styles
# - Change voice_id to match your preference
# - Use lower max_tokens for faster responses
# - Increase context_length for longer conversations
# ============================================================
