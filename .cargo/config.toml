[target.aarch64-apple-darwin]
linker = "/usr/bin/clang"

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/cc"

[target.x86_64-apple-darwin]
linker = "/usr/bin/clang"

# Target-specific compiler settings (work for both Rust and build scripts like CMake)
# Format: CC_<target> and CXX_<target> are recognized by both cargo and cc/cmake crates
[env]
CC_aarch64_apple_darwin = "/usr/bin/clang"
CXX_aarch64_apple_darwin = "/usr/bin/clang++"
CC_x86_64_apple_darwin = "/usr/bin/clang"
CXX_x86_64_apple_darwin = "/usr/bin/clang++"
# Disable BLAS in whisper.cpp to avoid symbol mismatch with macOS Accelerate framework
GGML_BLAS = "OFF"

# Use bundled whisper-rs-sys bindings on Linux/macOS to avoid runtime libclang/libLLVM coupling.
# This keeps builds stable across Linux/macOS (including mixed Nix/system shells).
# Windows generates bindings at build time, so don't set this there.
[target.x86_64-unknown-linux-gnu.env]
WHISPER_DONT_GENERATE_BINDINGS = "1"
# CUDA 13 + glibc 2.42+ compatibility (Linux only)
CC_x86_64_unknown_linux_gnu = "clang"
CXX_x86_64_unknown_linux_gnu = "clang++"
CMAKE_CUDA_HOST_COMPILER = "clang++"
# Set C++ standard to 17 for CUDA compatibility
CMAKE_CUDA_STANDARD = "17"
CMAKE_CUDA_ARCHITECTURES = "native"
# Suppress glibc 2.42+ exception specification errors with CUDA 13+
CMAKE_CUDA_FLAGS = "-Xcompiler=-Wno-error=mismatched-exception-spec,-Wno-mismatched-exception-spec"

[target.aarch64-unknown-linux-gnu.env]
WHISPER_DONT_GENERATE_BINDINGS = "1"

[target.aarch64-apple-darwin.env]
WHISPER_DONT_GENERATE_BINDINGS = "1"

[target.x86_64-apple-darwin.env]
WHISPER_DONT_GENERATE_BINDINGS = "1"

# Windows x86_64 MSVC optimizations
[target.x86_64-pc-windows-msvc.env]
# Generate bindings at build time on Windows (required)
WHISPER_DONT_GENERATE_BINDINGS = "0"
# Enable OpenBLAS for 20-30x performance improvement on Windows
# Without BLAS, matrix operations are unoptimized and extremely slow (40-60s vs 2s transcription)
GGML_BLAS = "ON"
GGML_OPENBLAS = "ON"
# Enable AVX/AVX2 CPU optimizations for whisper.cpp on Windows via CMake
CMAKE_CXX_FLAGS = "/arch:AVX2 /O2 /fp:fast /GL"
CMAKE_C_FLAGS = "/arch:AVX2 /O2 /fp:fast /GL"
